<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Isoloir 2027</title>
<meta name="description" content="Réponds à des questions précises et découvre de quels candidats à la présidentielle 2027 tu es le plus proche.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400..700&display=swap">
<style>
/* Layout : une colonne mobile (560 px max) pour le test, une colonne large (1040 px) pour les programmes ; barre d'action collée en bas. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --surface-2: #E6E9E2; --ink: #14181E; --ink-2: #2A3038;
  --muted: #59606A; --faint: #8A919A; --rule: #D8DCD3;
  --accent: #0B6B70; --accent-strong: #084F53; --on-accent: #FFFFFF; --accent-soft: #DCEBE9;
  --warn: #8A4B14; --warn-soft: #F5E6D4;
  --night: #14181E; --night-2: #262D36; --on-night: #F2F3EF; --on-night-muted: #A9B1BA; --night-accent: #7CC5BF;
  --font-d: "Funnel Display", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-b: "Funnel Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r-s: 12px; --r: 16px; --r-l: 24px;
  --shadow: 0 1px 2px rgb(20 24 30 / .05), 0 10px 28px -16px rgb(20 24 30 / .25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1115; --surface: #171B21; --surface-2: #232830; --ink: #ECEEE9; --ink-2: #D2D6D0;
  --muted: #A1A8B1; --faint: #78808A; --rule: #2B3139;
  --accent: #5DB7B0; --accent-strong: #80CBC5; --on-accent: #071214; --accent-soft: #163330;
  --warn: #E2A86C; --warn-soft: #352617;
  --night: #E9ECE6; --night-2: #D3D8D0; --on-night: #14181E; --on-night-muted: #4D5560; --night-accent: #0B6B70;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -16px rgb(0 0 0 / .6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #171B21; --surface-2: #232830; --ink: #ECEEE9; --ink-2: #D2D6D0;
  --muted: #A1A8B1; --faint: #78808A; --rule: #2B3139;
  --accent: #5DB7B0; --accent-strong: #80CBC5; --on-accent: #071214; --accent-soft: #163330;
  --warn: #E2A86C; --warn-soft: #352617;
  --night: #E9ECE6; --night-2: #D3D8D0; --on-night: #14181E; --on-night-muted: #4D5560; --night-accent: #0B6B70;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -16px rgb(0 0 0 / .6);
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
#app { min-height: 100%; display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1:focus, h2:focus { outline: none; }

/* Écran */
.screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; padding-inline: 20px; box-sizing: border-box; }
.screen.wide { max-width: 1040px; }
.screen.enter > *:not(.footer-bar) { animation: rise .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: center; justify-content: space-between; height: 60px; margin-inline: -10px; flex: none; }
.topright { min-width: 44px; display: flex; justify-content: flex-end; align-items: center; padding-right: 6px; }
.iconspace { width: 44px; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:hover { background: var(--surface-2); }
.wordmark { display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 8px; border: 0; background: none; cursor: pointer; font-family: var(--font-d); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--ink); border-radius: 12px; }
.mark { width: 14px; height: 18px; box-sizing: border-box; border: 1.5px solid currentColor; border-top-width: 4px; border-radius: 4px; }
.count { font-size: 13.5px; font-weight: 600; color: var(--muted); }

.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.eyebrow.center { text-align: center; }
.title { font-family: var(--font-d); font-weight: 600; font-size: clamp(28px, 7vw, 38px); line-height: 1.08; letter-spacing: -0.025em; margin: 8px 0 0; text-wrap: balance; }
.lead { color: var(--muted); font-size: 16px; margin: 12px 0 0; max-width: 60ch; }
.h2 { font-family: var(--font-d); font-weight: 600; font-size: 22px; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.stack-l { display: flex; flex-direction: column; padding-top: 12px; }

/* Boutons */
.btn { height: 54px; border-radius: var(--r); border: 0; font-weight: 600; font-size: 16px; padding: 0 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: background-color .15s, transform .1s, box-shadow .15s; }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.primary:disabled { background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.link { background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; padding: 0 12px; }
.btn.link:hover { color: var(--ink); }
.btn.small { height: 40px; font-size: 14px; padding: 0 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.inline-link { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.footer-bar { position: sticky; bottom: 0; margin-top: auto; padding-top: 14px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; gap: 8px; align-items: center; z-index: 5; }

/* Accueil */
.home { justify-content: center; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding-block: 20px 4px; }
.booth { position: relative; width: 150px; height: 176px; margin-bottom: 18px; }
.booth .rod { position: absolute; left: -12px; right: -12px; top: 0; height: 6px; border-radius: 3px; background: var(--ink); }
.cabin { position: absolute; left: 0; right: 0; top: 6px; bottom: 10px; overflow: hidden; border-radius: 0 0 10px 10px; background: var(--surface-2); }
.floor { position: absolute; left: -20px; right: -20px; bottom: 0; height: 2px; border-radius: 1px; background: var(--rule); }
.ballot { position: absolute; left: 50%; top: 50%; width: 82px; height: 106px; transform: translate(-50%, -46%) rotate(-4deg); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.ballot-k { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ballot-y { font-family: var(--font-d); font-weight: 700; font-size: 26px; letter-spacing: -0.03em; color: var(--ink); }
.ballot-l { width: 48px; height: 3px; border-radius: 2px; background: var(--rule); }
.ballot-l.s { width: 32px; }
.curtain { position: absolute; top: 0; bottom: 0; width: 50.5%; background: repeating-linear-gradient(90deg, var(--night) 0 8px, var(--night-2) 8px 16px); }
.curtain.l { left: 0; transform-origin: left center; animation: openL 1.5s cubic-bezier(.65,0,.25,1) .35s both; }
.curtain.r { right: 0; transform-origin: right center; animation: openR 1.5s cubic-bezier(.65,0,.25,1) .35s both; }
@keyframes openL { from { transform: none; } to { transform: scaleX(.22); } }
@keyframes openR { from { transform: none; } to { transform: scaleX(.22); } }
.brand { font-family: var(--font-d); font-weight: 700; font-size: clamp(56px, 16vw, 76px); letter-spacing: -0.045em; line-height: .9; margin: 10px 0 0; }
.tagline { margin: 16px 0 0; max-width: 34ch; font-size: 17px; line-height: 1.45; color: var(--muted); text-wrap: balance; }
.facts { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.facts li { font-size: 13.5px; background: var(--surface); border-radius: 999px; padding: 6px 12px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.ctas { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 28px; }
.home-foot { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 calc(20px + env(safe-area-inset-bottom, 0px)); }

/* Pacte */
.pact { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; }
.pact li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border-radius: var(--r-l); padding: 18px; }
.pact-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.pact h2 { font-family: var(--font-d); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0 4px; }
.pact p { margin: 0; color: var(--muted); font-size: 15px; }

/* Choix du parcours */
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; padding-bottom: 28px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 18px 20px; border-radius: var(--r-l); background: var(--surface); border: 1.5px solid transparent; cursor: pointer; transition: border-color .15s, transform .1s; }
.choice:hover { border-color: var(--ink); }
.choice:active { transform: scale(.99); }
.choice.rec { border-color: var(--accent); }
.choice-top { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: space-between; }
.choice-h { font-family: var(--font-d); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.choice-m { font-size: 14px; font-weight: 600; color: var(--accent); }
.choice-d { font-size: 15px; color: var(--muted); }
.pill-rec, .pill-prio { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; }

/* Puces */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; padding-bottom: 4px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 14.5px; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s, border-color .15s; }
.chip:hover:not(:disabled) { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.chip-n { font-size: 12px; opacity: .65; }
.counter { margin: 14px 0 0; color: var(--muted); font-size: 14px; }

/* Progression */
.progress { display: flex; gap: 4px; flex: none; }
.seg-p { flex: 1; height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.seg-p i { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width .3s; }
.seg-p.cur { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
.seg-p.cur i { background: var(--accent); }

/* Chapitre */
.chapter-body { margin-block: auto; padding-block: 40px; }
.chapter-h { font-family: var(--font-d); font-weight: 700; font-size: clamp(46px, 13vw, 72px); letter-spacing: -0.04em; line-height: .95; margin: 12px 0 0; text-wrap: balance; }
.chapter-meta { margin: 18px 0 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }

/* Question */
.q-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.q-body { padding-top: 18px; }
.q { font-family: var(--font-d); font-weight: 600; font-size: clamp(26px, 6.6vw, 33px); line-height: 1.12; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.stmt { background: var(--surface); border-radius: var(--r-l); padding: 20px 20px 22px; box-shadow: var(--shadow); }
.stmt-k { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fmt-n .q { font-size: clamp(23px, 5.8vw, 29px); line-height: 1.18; }
.now { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: var(--muted); margin: 14px 0 0; }
.pill { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; margin-top: 1px; }
.now-src { color: var(--muted); font-size: 12.5px; text-underline-offset: 3px; }
.answer { margin-top: 22px; }

.scale-cap { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.paliers { position: relative; display: flex; flex-direction: column; gap: 6px; }
.rail { position: absolute; left: 27px; top: 24px; bottom: 24px; width: 2px; border-radius: 2px; background: var(--rule); }
.opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 10px 14px 10px 17px; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); font-weight: 500; font-size: 16.5px; line-height: 1.3; text-align: left; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s; }
.opt:hover:not([aria-pressed="true"]) { border-color: var(--ink); }
.opt .dot { flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--faint); background: var(--surface); transition: background-color .15s; }
.opt.cat .dot { border-radius: 6px; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt[aria-pressed="true"] .dot { border-color: var(--bg); background: var(--accent); }
.opt-l { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-l small { font-size: 13.5px; opacity: .75; }
.k { font-family: var(--font-b); font-size: 11px; color: var(--faint); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; display: none; }
@media (hover: hover) and (pointer: fine) { .k { display: inline-block; } }
.opt[aria-pressed="true"] .k { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.or { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.or span { flex: 1; border-top: 1px dashed var(--rule); }

.likert { position: relative; display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.likert-line { position: absolute; left: 26px; right: 26px; top: 50%; height: 2px; border-radius: 1px; background: var(--rule); }
.lk { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.lk span { display: block; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--faint); background: var(--bg); transition: transform .15s, background-color .15s, border-color .15s; }
.lk:hover span { border-color: var(--ink); transform: scale(1.06); }
.lk[aria-checked="true"] span { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 30%, transparent); }
.likert-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.likert-ends span:last-child { text-align: right; }
.likert-choice { margin: 18px 0 0; text-align: center; font-family: var(--font-d); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; min-height: 30px; }
.likert-choice .muted { font-family: var(--font-b); font-size: 15px; font-weight: 500; }

.duel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; margin-bottom: 14px; }
.duel-card { background: var(--surface); border-radius: var(--r); padding: 14px; font-size: 15px; line-height: 1.35; font-weight: 500; border: 1.5px solid transparent; transition: border-color .15s, background-color .15s; }
.duel-card.on { border-color: var(--ink); }
.duel-k { display: block; font-family: var(--font-d); font-weight: 700; font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.duel-vs { align-self: center; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

.gauge { display: flex; flex-direction: column; }
.readout { display: flex; flex-direction: column; gap: 2px; min-height: 76px; }
.readout-v { font-family: var(--font-d); font-weight: 600; font-size: clamp(38px, 11vw, 52px); letter-spacing: -0.035em; line-height: 1.05; }
.readout-s { font-size: 15px; font-weight: 600; color: var(--muted); min-height: 22px; }
.nuke { position: relative; padding-top: 22px; margin-top: 14px; }
.nuke-today { position: absolute; top: 0; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 1; pointer-events: none; }
.nuke-today em { font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); height: 20px; white-space: nowrap; }
.nuke-today::after { content: ""; flex: 1; border-left: 2px dashed var(--bg); }
.nuke-bar { display: flex; height: 52px; border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.nuke-bar i { display: flex; align-items: center; background: var(--ink); color: var(--bg); padding-left: 14px; box-sizing: border-box; overflow: hidden; white-space: nowrap; font-style: normal; transition: width .35s cubic-bezier(.2,.7,.2,1); }
.nuke-bar b, .nuke-rest { font-size: 13px; font-weight: 600; }
.nuke-rest { flex: 1; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; }
input.jauge { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 14px 0 0; background: transparent; cursor: pointer; }
input.jauge::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--surface-2); }
input.jauge::-moz-range-track { height: 8px; border-radius: 999px; background: var(--surface-2); }
input.jauge::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); box-shadow: var(--shadow); }
input.jauge::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint); }
input.jauge.on::-webkit-slider-thumb { background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 1.5px var(--ink); }
input.jauge.on::-moz-range-thumb { background: var(--ink); border: 4px solid var(--bg); box-shadow: 0 0 0 1.5px var(--ink); }
.crans { display: grid; gap: 4px; margin: 2px -4px 0; }
.cran { min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; line-height: 1.2; cursor: pointer; padding: 4px 2px; }
.cran:hover { color: var(--ink); }
.cran[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

.imp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.imp-l { font-size: 14px; font-weight: 600; }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.wide { margin-top: 14px; }
.seg.wide button, .seg.big button { flex: 1; }
.seg.big { margin-top: 18px; }
.seg.big button { min-height: 44px; font-size: 14.5px; }

/* Résultats */

  function firstName(c) { return c.n.split(" ")[0]; }

  function isCat(q, v) { return !!q.cat && v === q.o.length; }
  function agree(q, u, c) {
    if (q.cat && (isCat(q, u) || isCat(q, c))) return u === c ? 1 : 0.25;
    const n = nOpts(q);
    return 1 - Math.abs(u - c) / (n - 1);
  }

  V.progCand = V.candOrder[0]; V.faceA = V.candOrder[0]; V.faceB = V.candOrder[1];

  /* ---------- Scores ---------- */
  function scores() {
    const res = CANDS.map(function (c) { return { c: c, sum: 0, w: 0, n: 0, th: {} }; });

    Object.keys(S.ans).forEach(function (qid) {
      const q = QMAP[qid]; const a = S.ans[qid];
      if (!q || a.v == null) return;
      answered++;
      const w = IMP[a.imp == null ? 1 : a.imp].w * (S.prio.indexOf(q.t) >= 0 ? PRIO_W : 1);
      res.forEach(function (r) {
        const p = q.P[r.c.id]; if (!p) return;
        const g = agree(q, a.v, p[0]);
        r.sum += w * g; r.w += w; r.n++;
        const t = r.th[q.t] || (r.th[q.t] = { sum: 0, w: 0, n: 0 });
        t.sum += w * g; t.w += w; t.n++;
      });
    });
    res.forEach(function (r) {
      r.pct = Math.round(((r.sum + K * 0.5) / (r.w + K)) * 100);

      r.partial = r.n < Math.max(6, 0.3 * answered);

    return '<div class="progress" role="img" aria-label="Thème ' + (themesInRun.indexOf(curT) + 1) + ' sur ' + themesInRun.length + '">' +
      themesInRun.map(function (t) {
        const ids = S.order.filter(function (id) { return QMAP[id].t === t; });
        const done = ids.filter(function (id) { return S.ans[id]; }).length;
        const pct = Math.round(done / ids.length * 100);
        return '<span class="seg-p' + (t === curT ? " cur" : "") + '"><i style="width:' + pct + '%"></i></span>';
      }).join("") + '</div>';
  }

  SCREENS.chapter = function () {
    const q = curQ(); const t = TMAP[q.t];
    const themesInRun = [];
    S.order.forEach(function (id) { const tt = QMAP[id].t; if (themesInRun.indexOf(tt) < 0) themesInRun.push(tt); });
    const n = S.order.filter(function (id) { return QMAP[id].t === q.t; }).length;
    const prio = S.prio.indexOf(q.t) >= 0;
    return '<main class="screen chapter">' + topbar(S.idx > 0 ? "prevQ" : "toPrioBack", '<span class="count num">' + (S.idx) + '/' + S.order.length + '</span>') +
      progressBar() +
      '<div class="chapter-body">' +
      '<p class="eyebrow num">Chapitre ' + (themesInRun.indexOf(q.t) + 1) + ' sur ' + themesInRun.length + '</p>' +
      '<h1 class="chapter-h" tabindex="-1">' + esc(t.n) + '</h1>' +
      '<p class="lead">' + esc(t.d) + '</p>' +
      '<p class="chapter-meta num">' + n + (n > 1 ? " questions" : " question") + (prio ? ' · <span class="pill-prio">Prioritaire</span>' : "") + '</p>' +
      '</div>' +
      '<div class="footer-bar"><button class="btn primary grow" data-a="enterChapter">Commencer le chapitre' + ICON.arrow + '</button></div></main>';
  };

  function nowLine(q) {
    if (!q.now) return "";
    return '<p class="now"><span class="pill">Aujourd\'hui</span><span>' + esc(q.now) + (q.nowSrc ? ' <a class="now-src" href="' + esc(SRC[q.nowSrc].u) + '" target="_blank" rel="noopener">Source</a>' : "") + '</span></p>';
  }

  function answerUI(q) {
    const v = V.draft.v;
    if (q.f === "p") {
      let h = '<p class="scale-cap">' + esc(q.scale || "") + '</p><div class="paliers"><span class="rail" aria-hidden="true"></span>' +
        q.o.map(function (o, i) {
          return '<button class="opt" data-a="pick" data-v="' + i + '" aria-pressed="' + (v === i) + '"><span class="dot" aria-hidden="true"></span><span class="opt-l">' + esc(o) + '</span><kbd class="k num" aria-hidden="true">' + (i + 1) + '</kbd></button>';
        }).join("") + '</div>';
      if (q.cat) {
        const ci = q.o.length;
        h += '<div class="or" aria-hidden="true"><span></span>ou<span></span></div>' +
          '<button class="opt cat" data-a="pick" data-v="' + ci + '" aria-pressed="' + (v === ci) + '"><span class="dot" aria-hidden="true"></span><span class="opt-l"><span>' + esc(q.cat.l) + '</span><small>' + esc(q.cat.s) + '</small></span><kbd class="k num" aria-hidden="true">' + (ci + 1) + '</kbd></button>';
      }
      return h;
    }
    if (q.f === "n" || q.f === "a") {
      const sizes = [44, 34, 26, 34, 44];
      const dots = '<div class="likert" role="radiogroup" aria-label="Ta position">' +
        '<span class="likert-line" aria-hidden="true"></span>' +
        [0, 1, 2, 3, 4].map(function (i) {
          const label = q.f === "n" ? NU[i] : (i === 2 ? "Entre les deux" : (i < 2 ? (i === 0 ? "Nettement A" : "Plutôt A") : (i === 4 ? "Nettement B" : "Plutôt B")));
          return '<button class="lk" role="radio" aria-checked="' + (v === i) + '" aria-label="' + esc(label) + '" data-a="pick" data-v="' + i + '"><span style="width:' + sizes[i] + 'px;height:' + sizes[i] + 'px"></span></button>';
        }).join("") + '</div>' +
        '<div class="likert-ends"><span>' + (q.f === "n" ? "Pas du tout d'accord" : "Option A") + '</span><span>' + (q.f === "n" ? "Tout à fait d'accord" : "Option B") + '</span></div>' +
        '<p class="likert-choice" aria-live="polite">' + (v == null ? '<span class="muted">Choisis ta position</span>' : esc(q.f === "n" ? NU[v] : ansLabel(q, v))) + '</p>';
      if (q.f === "a") {
        const lean = v == null ? -1 : (v < 2 ? 0 : (v > 2 ? 1 : 2));
        return '<div class="duel">' +
          '<div class="duel-card' + (lean === 0 ? " on" : "") + '"><span class="duel-k">A</span>' + esc(q.a[0]) + '</div>' +
          '<span class="duel-vs" aria-hidden="true">ou</span>' +
          '<div class="duel-card' + (lean === 1 ? " on" : "") + '"><span class="duel-k">B</span>' + esc(q.a[1]) + '</div>' +
          '</div>' + dots;
      }
      return dots;
    }
    if (q.f === "j") {
      const n = q.o.length; const touched = v != null;
      const val = touched ? v : Math.floor((n - 1) / 2);
      const short = q.ol || q.o;
      let viz = "";
      if (q.gauge === "nuke") {
        const p = touched ? q.pct[v] : null;
        viz = '<div class="nuke"><span class="nuke-today" style="left:66%" aria-hidden="true"><em>aujourd\'hui</em></span>' +
          '<div class="nuke-bar"><i style="width:' + (p == null ? 0 : p) + '%"><b>' + (p != null && p >= 25 ? "Nucléaire" : "") + '</b></i><b class="nuke-rest">' + (p == null || p <= 75 ? "Autres sources" : "") + '</b></div></div>';
      }
      return '<div class="gauge">' +
        '<div class="readout"><span class="readout-v">' + (touched ? esc(short[v]) : "—") + '</span><span class="readout-s">' + (touched ? esc(q.o[v] === short[v] ? "" : q.o[v]) : "Fais glisser ou touche un cran") + '</span></div>' +
        viz +
        '<label class="sr" for="jauge-' + q.id + '">' + esc(q.q) + '</label>' +
        '<input id="jauge-' + q.id + '" class="jauge' + (touched ? " on" : "") + '" type="range" min="0" max="' + (n - 1) + '" step="1" value="' + val + '" data-in="jauge" aria-valuetext="' + esc(touched ? q.o[v] : "Pas encore choisi") + '">' +
        '<div class="crans" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + short.map(function (s, i) {
          return '<button class="cran" data-a="pick" data-v="' + i + '" aria-pressed="' + (v === i) + '">' + esc(s) + '</button>';
        }).join("") + '</div>' +
        '<p class="hint">La jauge avance par crans : les candidats s\'expriment rarement au chiffre près.</p></div>';
    }
    return "";
  }

  SCREENS.question = function () {
    const q = curQ(); const t = TMAP[q.t];
    const inTheme = S.order.filter(function (id) { return QMAP[id].t === q.t; });
    const k = inTheme.indexOf(q.id) + 1;
    const last = S.idx === S.order.length - 1;
    const nextLabel = V.edit ? "Enregistrer" : (last ? "Voir mes résultats" : "Question suivante");
    const head = q.f === "n"
      ? '<div class="stmt"><p class="stmt-k">Proposition</p><h1 class="q" tabindex="-1">' + esc(q.q) + '</h1></div>'
      : '<h1 class="q" tabindex="-1">' + esc(q.q) + '</h1>';
    return '<main class="screen question fmt-' + q.f + '">' +
      topbar(V.edit ? "toReview" : "prevQ", '<span class="count num">' + (S.idx + 1) + '/' + S.order.length + '</span>') +
      (V.edit ? "" : progressBar()) +
      '<div class="q-meta"><span class="eyebrow">' + esc(t.n) + '</span><span class="num">' + (V.edit ? "Modifier ma réponse" : "Question " + k + " sur " + inTheme.length) + '</span></div>' +
      '<div class="q-body">' + head + nowLine(q) + '<div class="answer">' + answerUI(q) + '</div></div>' +
      '<div class="imp-row"><span class="imp-l" id="imp-l">Poids dans mon choix</span><div class="seg" role="group" aria-labelledby="imp-l">' +
      IMP.map(function (m, i) { return '<button data-a="imp" data-v="' + i + '" aria-pressed="' + (V.draft.imp === i) + '">' + m.l + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="footer-bar"><button class="btn link" data-a="skipQ">Sans avis</button><button class="btn primary grow" data-a="next"' + (V.draft.v === undefined || V.draft.v === null ? " disabled" : "") + '>' + nextLabel + ICON.arrow + '</button></div>' +
      '</main>';
  };

  SCREENS.review = function () {
    const groups = THEMES.filter(function (t) { return S.order.some(function (id) { return QMAP[id].t === t.id; }); });
    return '<main class="screen">' + topbar("results") +
      '<div class="stack-l"><p class="eyebrow">Tes réponses</p><h1 class="title" tabindex="-1">Modifier mes réponses</h1>' +
      '<p class="lead">Touche une question pour changer ta réponse. Les scores se recalculent aussitôt.</p>' +
      groups.map(function (t) {
        return '<section class="rev-group"><h2 class="h2">' + esc(t.n) + '</h2>' +
          S.order.filter(function (id) { return QMAP[id].t === t.id; }).map(function (id) {
            const q = QMAP[id]; const a = S.ans[id];
            return '<button class="rev-item" data-a="editQ" data-v="' + id + '"><span class="rev-q">' + esc(q.q) + '</span><span class="rev-a">' + esc(a ? ansLabel(q, a.v) : "Pas répondu") + (a && a.v != null && a.imp !== 1 ? ' · ' + IMP[a.imp].l : "") + '</span>' + ICON.chev + '</button>';
          }).join("") + '</section>';
      }).join("") + '</div>' +
      '<div class="footer-bar"><button class="btn primary grow" data-a="results">Voir mes résultats' + ICON.arrow + '</button></div></main>';
  };

  SCREENS.results = function () {
    const R = scores();
    if (!R.ranked.length) {
      return '<main class="screen">' + topbar("home") + '<div class="stack-l"><h1 class="title" tabindex="-1">Pas encore de résultat</h1><p class="lead">Tu n\'as répondu « sans avis » qu\'à des questions où les positions sont connues. Réponds à quelques questions pour voir tes affinités.</p></div><div class="footer-bar"><button class="btn primary grow" data-a="review">Reprendre mes réponses</button></div></main>';
    }
    const top = R.ranked[0]; const second = R.ranked[1];
    const reveal = V.revealNow;
    let h = '<main class="screen results">' + topbar("home", '<button class="btn link small" data-a="review">Modifier</button>') +
      '<section class="top-card' + (reveal ? " reveal" : "") + '" aria-labelledby="top-name">' +
      '<div class="folds" aria-hidden="true"></div>' +
      '<div class="top-in">' +
      '<p class="top-k">Le plus proche de tes réponses</p>' +
      '<h1 class="top-name" id="top-name" tabindex="-1">' + esc(top.c.n) + '</h1>' +
      '<p class="top-p">' + esc(top.c.p) + '</p>' +
      '<div class="top-score"><span class="big num">' + top.pct + '<em>%</em></span><span class="top-d">d\'accord, sur les <b class="num">' + top.n + '</b> questions où sa position est connue</span></div>' +
      '<div class="top-foot num"><span>' + (second ? "Écart avec le 2ᵉ : " + (top.pct - second.pct) + (top.pct - second.pct > 1 ? " points" : " point") : "") + '</span><span>' + R.answered + ' réponses</span></div>' +
      '</div>' +
      (reveal ? '<span class="rv l" aria-hidden="true"></span><span class="rv r" aria-hidden="true"></span>' : "") +
      '</section>' +
      '<p class="disclaimer">Une proximité avec tes réponses, pas une consigne de vote. Le calcul s\'est fait sur ton appareil : rien n\'a été envoyé.</p>';

    h += '<div class="sec-head"><h2 class="h2">Tous les candidats</h2><div class="seg" role="group" aria-label="Affichage">' +
      '<button data-a="view" data-v="global" aria-pressed="' + (V.view === "global") + '">Global</button>' +
      '<button data-a="view" data-v="themes" aria-pressed="' + (V.view === "themes") + '">Par thème</button></div></div>';

    if (V.view === "global") {
      h += '<div class="rank">' + R.ranked.map(function (r, i) {
        return '<button class="rank-row" data-a="sheet" data-v="' + r.c.id + '">' +
          '<span class="rank-i num">' + (i + 1) + '</span>' +
          '<span class="rank-n"><b>' + esc(r.c.n) + '</b><small>' + esc(r.c.p) + ' · <span class="num">' + r.n + '</span> q.</small></span>' +
          '<span class="rank-p num">' + r.pct + ' %</span>' +
          '<span class="rank-bar"><i style="width:' + r.pct + '%"' + (i === 0 ? ' class="lead"' : "") + '></i></span>' +
          '<span class="rank-f">' + (r.partial ? "Partiel" : "") + '</span>' +
          '</button>';
      }).join("") + '</div>' +
        '<p class="note"><b class="flag">Partiel</b> peu de positions connues sur tes questions : score moins fiable. Touche un candidat pour voir le détail.</p>';
    } else {
      const ths = THEMES.filter(function (t) { return R.ranked.some(function (r) { return r.th[t.id]; }); });
      h += '<div class="heat-wrap"><table class="heat"><thead><tr><th scope="col"><span class="sr">Candidat</span></th>' +
        ths.map(function (t) { return '<th scope="col"><span>' + esc(t.n) + '</span></th>'; }).join("") + '</tr></thead><tbody>' +
        R.ranked.map(function (r) {
          return '<tr><th scope="row"><button data-a="sheet" data-v="' + r.c.id + '">' + esc(lastName(r.c)) + '</button></th>' +
            ths.map(function (t) {
              const x = r.th[t.id];
              if (!x) return '<td class="na" title="Pas de position connue">–</td>';
              const p = Math.round(x.sum / x.w * 100);
              return '<td class="num' + (p >= 60 ? " hi" : "") + '" style="--p:' + Math.round(p * 0.9) + '%" title="' + esc(r.c.n + " · " + t.n + " : " + p + " % sur " + x.n + " question" + (x.n > 1 ? "s" : "")) + '">' + p + '</td>';
            }).join("") + '</tr>';
        }).join("") + '</tbody></table></div>' +
        '<p class="note">Pourcentage d\'accord par thème. Un tiret : aucune position connue sur tes questions de ce thème.</p>';
    }

    const items = [];
    Object.keys(S.ans).forEach(function (qid) {
      const q = QMAP[qid]; const a = S.ans[qid]; const p = q && q.P[top.c.id];
      if (!q || a.v == null || !p) return;
      items.push({ q: q, a: a, p: p, g: agree(q, a.v, p[0]) });
    });
    const best = items.slice().sort(function (x, y) { return y.g - x.g || (y.a.imp - x.a.imp); })[0];
    const worst = items.slice().sort(function (x, y) { return x.g - y.g || (y.a.imp - x.a.imp); })[0];
    if (best && worst && best !== worst) {
      h += '<h2 class="h2 sec">Avec ' + esc(top.c.n) + '</h2><div class="pair">' +
        pairCard("Votre plus grand accord", best, top.c) + (worst.g < 1 ? pairCard("Votre plus grand écart", worst, top.c) : "") + '</div>';
    }

    if (R.unranked.length) {
      h += '<p class="note">Pas assez de positions connues sur tes questions pour classer : ' + R.unranked.map(function (r) { return esc(r.c.n); }).join(", ") + '.</p>';
    }

    h += '<div class="actions">' +
      '<button class="btn primary block" data-a="share">Partager mon résultat</button>' +
      '<button class="btn ghost block" data-a="programmes">Comparer les programmes</button>' +
      '<div class="actions-row"><button class="btn link" data-a="review">Modifier mes réponses</button><button class="btn link" data-a="restart">Refaire le test</button></div>' +
      '</div>' +
      '<p class="home-foot"><button class="inline-link" data-a="methode">Comment le score est calculé</button></p>' +
      '</main>';
    return h;
  };

  function pairCard(label, it, c) {
    return '<article class="pair-card"><p class="pair-k">' + label + '</p><p class="pair-t">' + esc(TMAP[it.q.t].n) + '</p><h3 class="pair-q">' + esc(it.q.q) + '</h3>' +
      '<dl class="cmp-grid"><dt>Toi</dt><dd>' + esc(ansLabel(it.q, it.a.v)) + '</dd><dt>' + esc(firstName(c)) + '</dt><dd>' + esc(posLabel(it.q, it.p[0])) + (it.p[2] ? '<small>' + esc(it.p[2]) + '</small>' : "") + '</dd></dl>' +
      '<p class="pair-src">' + srcLink(it.p[1]) + badges(it.p) + '</p></article>';
  }

  function sheetHTML() {
    const c = CMAP[V.sheet]; if (!c) return "";
    const R = scores();
    const r = R.ranked.concat(R.unranked).filter(function (x) { return x.c.id === c.id; })[0];
    const items = [];
    S.order.forEach(function (qid) {
      const q = QMAP[qid]; const a = S.ans[qid]; const p = q.P[c.id];
      if (!a || a.v == null || !p) return;
      items.push({ q: q, a: a, p: p, g: agree(q, a.v, p[0]) });
    });
    const f = V.sheetFilter;
    const shown = items.filter(function (it) { return f === "all" || (f === "ok" ? it.g >= 0.75 : it.g < 0.5); });
    return '<div class="sheet-back" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" data-stop="1">' +
      '<div class="sheet-head"><span class="grab" aria-hidden="true"></span><div class="sheet-top"><div><h2 class="sheet-h" id="sheet-h" tabindex="-1">' + esc(c.n) + '</h2><p class="muted">' + esc(c.p) + '</p></div>' +
      '<button class="iconbtn" data-a="closeSheet" aria-label="Fermer">' + ICON.close + '</button></div>' +
      (r && r.n ? '<p class="sheet-score"><span class="num">' + r.pct + ' %</span> d\'accord sur <span class="num">' + r.n + '</span> question' + (r.n > 1 ? "s" : "") + '</p>' : "") +
      (c.note ? '<p class="cand-note">' + esc(c.note) + '</p>' : "") +
      '<div class="seg wide" role="group" aria-label="Filtrer">' +
      [["all", "Tout"], ["ok", "Accords"], ["ko", "Écarts"]].map(function (x) { return '<button data-a="sheetFilter" data-v="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="sheet-list">' + (shown.length ? shown.map(function (it) {
        const cls = it.g >= 0.75 ? "ok" : (it.g >= 0.5 ? "mid" : "ko");
        const lab = it.g >= 0.75 ? "Accord" : (it.g >= 0.5 ? "Proche" : "Écart");
        return '<article class="cmp"><div class="cmp-top"><span class="eyebrow">' + esc(TMAP[it.q.t].n) + '</span><span class="agree ' + cls + '">' + lab + '</span></div>' +
          '<h3 class="cmp-q">' + esc(it.q.q) + '</h3>' +
          '<dl class="cmp-grid"><dt>Toi</dt><dd>' + esc(ansLabel(it.q, it.a.v)) + '</dd><dt>' + esc(firstName(c)) + '</dt><dd>' + esc(posLabel(it.q, it.p[0])) + (it.p[2] ? '<small>' + esc(it.p[2]) + '</small>' : "") + '</dd></dl>' +
          '<p class="pair-src">' + srcLink(it.p[1]) + badges(it.p) + '</p></article>';
      }).join("") : '<p class="muted pad">Aucune question dans cette catégorie.</p>') + '</div>' +
      '<div class="sheet-foot"><button class="btn ghost block" data-a="candProg" data-v="' + c.id + '">Voir toutes ses positions</button></div>' +
      '</div></div>';
  }

  function posBlock(q, cid) {
    const p = q.P[cid];
    if (!p) return '<span class="pos-none">Pas de position connue à ce jour</span>';
    return '<span class="pos-v">' + esc(posLabel(q, p[0])) + '</span>' + (p[2] ? '<span class="pos-note">' + esc(p[2]) + '</span>' : "") +
      '<span class="pos-src">' + srcLink(p[1]) + badges(p) + '</span>';
  }

  SCREENS.programmes = function () {
    let h = '<main class="screen wide progs">' + topbar("home") +
      '<div class="prog-head"><p class="eyebrow">Les programmes</p><h1 class="title" tabindex="-1">Qui propose quoi</h1>' +
      '<p class="lead">' + QS.length + ' questions, ' + CANDS.length + ' candidats. Mis à jour le ' + MAJ + '. L\'ordre des candidats est tiré au sort à chaque visite.</p></div>';
    if (!S.done) {
      h += '<div class="blind"><p>Pour un résultat à l\'aveugle, fais le test avant de lire les programmes.</p><button class="btn primary small" data-a="' + (S.order.length ? "resume" : "start") + '">' + (S.order.length ? "Reprendre le test" : "Faire le test") + '</button></div>';
    }
    h += '<div class="seg big" role="tablist" aria-label="Vue">' +
      [["theme", "Par thème"], ["cand", "Par candidat"], ["face", "Face à face"]].map(function (x) {

      }).join("") + '</div>';
      h += '<div class="qlist">' + QS.filter(function (q) { return q.t === V.progTheme; }).map(function (q) {
        return '<article class="qcard"><h2 class="qcard-q">' + (q.f === "n" ? '<span class="qcard-k">Proposition</span>' : "") + esc(q.q) + '</h2>' +
          (q.f === "a" ? '<p class="qcard-a"><b>A</b> ' + esc(q.a[0]) + '<br><b>B</b> ' + esc(q.a[1]) + '</p>' : "") +

          '<div class="pos-list">' + V.candOrder.map(function (cid) {

          }).join("") + '</div></article>';
      }).join("") + '</div>';
    } else if (V.progTab === "cand") {
      const c = CMAP[V.progCand];
      const known = QS.filter(function (q) { return q.P[c.id]; });
      h += '<div class="chips scroll" role="group" aria-label="Candidat">' + V.candOrder.map(function (cid) {
        return '<button class="chip" data-a="progCand" data-v="' + cid + '" aria-pressed="' + (V.progCand === cid) + '">' + esc(CMAP[cid].n) + '</button>';
      }).join("") + '</div>' +
        '<div class="cand-card"><h2 class="cand-h">' + esc(c.n) + '</h2><p class="muted">' + esc(c.p) + ' · <span class="num">' + known.length + '</span> positions connues sur ' + QS.length + '</p>' + (c.note ? '<p class="cand-note">' + esc(c.note) + '</p>' : "") + '</div>';
      THEMES.forEach(function (t) {
        const qs = known.filter(function (q) { return q.t === t.id; });
        if (!qs.length) return;
        h += '<section class="cand-sec"><h3 class="h2">' + esc(t.n) + '</h3><div class="qlist">' + qs.map(function (q) {
          return '<article class="qcard slim"><h4 class="qcard-q">' + esc(q.q) + '</h4><div class="pos-solo">' + posBlock(q, c.id) + '</div></article>';
        }).join("") + '</div></section>';
      });
    } else {
      const A = CMAP[V.faceA], B = CMAP[V.faceB];
      const opts = function (sel) { return V.candOrder.map(function (cid) { return '<option value="' + cid + '"' + (cid === sel ? " selected" : "") + '>' + esc(CMAP[cid].n) + '</option>'; }).join(""); };
      h += '<div class="face-pick"><label class="sel"><span>Candidat A</span><select id="face-a" data-in="faceA">' + opts(V.faceA) + '</select></label>' +
        '<label class="sel"><span>Candidat B</span><select id="face-b" data-in="faceB">' + opts(V.faceB) + '</select></label></div>';
      const qs = QS.filter(function (q) { return q.P[A.id] || q.P[B.id]; });
      let same = 0, both = 0;
      qs.forEach(function (q) { if (q.P[A.id] && q.P[B.id]) { both++; if (agree(q, q.P[A.id][0], q.P[B.id][0]) >= 0.75) same++; } });
      h += '<p class="lead num">' + both + ' questions où l\'on connaît la position des deux · ' + same + ' positions proches</p>';
      THEMES.forEach(function (t) {
        const tq = qs.filter(function (q) { return q.t === t.id; });
        if (!tq.length) return;
        h += '<section class="cand-sec"><h3 class="h2">' + esc(t.n) + '</h3><div class="qlist">' + tq.map(function (q) {
          let tag = "";
          if (q.P[A.id] && q.P[B.id]) { const g = agree(q, q.P[A.id][0], q.P[B.id][0]); tag = g >= 0.75 ? '<span class="agree ok">Proches</span>' : (g >= 0.5 ? '<span class="agree mid">Nuancés</span>' : '<span class="agree ko">Opposés</span>'); }
          return '<article class="qcard slim"><div class="cmp-top"><h4 class="qcard-q">' + esc(q.q) + '</h4>' + tag + '</div><div class="face"><div><span class="face-c">' + esc(A.n) + '</span>' + posBlock(q, A.id) + '</div><div><span class="face-c">' + esc(B.n) + '</span>' + posBlock(q, B.id) + '</div></div></article>';
        }).join("") + '</div></section>';
      });
    }
    h += '<p class="home-foot"><button class="inline-link" data-a="methode">Méthode et sources</button></p></main>';
    return h;
  };

  SCREENS.methode = function () {
    const used = {};
    QS.forEach(function (q) { Object.keys(q.P).forEach(function (k) { used[q.P[k][1]] = 1; }); if (q.nowSrc) used[q.nowSrc] = 1; });
    return '<main class="screen prose-screen">' + topbar("home") +
      '<article class="prose"><p class="eyebrow">Méthode</p><h1 class="title" tabindex="-1">Comment Isoloir fonctionne</h1>' +
      '<h2>Le calcul</h2>' +
      '<p>Chaque réponse est placée sur une échelle : cinq nuances pour les propositions et les arbitrages, des paliers ou des crans pour les autres questions. Pour chaque candidat dont la position est connue, l\'accord vaut 100 % si vous êtes au même endroit, et baisse avec l\'écart. Une réponse hors échelle, comme « plus d\'âge légal », compte pour 25 % face à une réponse sur l\'échelle.</p>' +
      '<p>Chaque question pèse 0,5, 1 ou 2 selon le poids que tu lui donnes, multiplié par 1,5 si son thème fait partie de tes priorités. Les questions « sans avis » et celles où la position du candidat est inconnue ne comptent pas.</p>' +
      '<p>Pour éviter qu\'un candidat avec deux positions connues affiche 100 %, le score est tiré légèrement vers 50 % quand il repose sur peu de questions. Un candidat n\'est classé qu\'à partir de trois questions en commun, et marqué « Partiel » en dessous de six questions ou de 30 % de tes réponses.</p>' +
      '<h2>Les positions</h2>' +
      '<p>Chaque position renvoie à sa source : programme officiel, déclaration ou article de presse. Deux étiquettes signalent les cas plus fragiles :</p>' +
      '<ul><li><b>Estimée</b> : le candidat n\'a pas répondu à cette question précise ; sa position est déduite de mesures proches, citées en note.</li><li><b>Programme antérieur</b> : la position vient d\'un programme d\'une élection précédente (2022 ou 2024), faute de programme 2027 publié.</li></ul>' +
      '<p>Beaucoup de candidats n\'ont pas encore publié de programme complet. Les positions seront mises à jour au fil de la campagne.</p>' +
      '<h2>La neutralité</h2>' +
      '<ul><li>Aucune couleur de parti, nulle part.</li><li>Les propositions sont présentées sans nom de candidat pendant le test.</li><li>Dans « Les programmes », l\'ordre des candidats est tiré au sort à chaque visite.</li><li>Les questions portent sur des mesures concrètes, formulées de la façon la plus neutre possible. Signale-nous toute formulation qui te semble orientée.</li></ul>' +
      '<h2>Tes données</h2>' +
      '<p>Tout se passe sur ton appareil. Tes réponses sont gardées dans ton navigateur pour te permettre de reprendre plus tard, et ne sont envoyées nulle part. Le bouton « Refaire le test » les efface.</p>' +
      '<h2>Les limites</h2>' +
      '<p>Une soixantaine de questions ne résument pas un programme, et le résultat dépend des questions choisies. Isoloir est un point de départ pour lire les programmes, pas un substitut.</p>' +
      '<h2>Sources</h2><ul class="srcs">' + Object.keys(SRC).filter(function (k) { return used[k]; }).map(function (k) {
        return '<li><a href="' + esc(SRC[k].u) + '" target="_blank" rel="noopener">' + esc(SRC[k].l) + '</a></li>';
      }).join("") + '</ul>' +
      '<p class="muted">Données au ' + MAJ + '. Isoloir n\'est affilié à aucun parti ni candidat.</p>' +
      '</article></main>';
  };

  /* ---------- Rendu ---------- */
  const app = document.getElementById("app");
  let lastScreen = null;
  function render() {
    const scr = SCREENS[V.screen] ? V.screen : "home";
    const changed = scr !== lastScreen || scr === "question" || scr === "chapter";
    app.innerHTML = SCREENS[scr]() + (V.sheet ? sheetHTML() : "");
    app.firstElementChild.classList.toggle("enter", changed);
    if (changed) {
      try { window.scrollTo(0, 0); } catch (e) { }
      const h = app.querySelector("h1[tabindex]");
      if (h) h.focus({ preventScroll: true });
    }
    lastScreen = scr;
    if (V.revealNow && scr === "results") {
      const card = app.querySelector(".top-card.reveal");
      const done = function () { V.revealNow = false; S.revealed = true; save(); };
      if (!card || matchMedia("(prefers-reduced-motion: reduce)").matches) done();
      else setTimeout(done, 2100);
    }
  }
  function renderKeep() {
    const y = window.scrollY;
    const sheetList = app.querySelector(".sheet");
    const sy = sheetList ? sheetList.scrollTop : 0;
    app.innerHTML = SCREENS[V.screen]() + (V.sheet ? sheetHTML() : "");
    window.scrollTo(0, y);
    const s2 = app.querySelector(".sheet"); if (s2) s2.scrollTop = sy;
  }

  /* ---------- Partage ---------- */
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("on"); }, 2200);
  }
  function shareText() {
    const R = scores();
    const lines = R.ranked.slice(0, 3).map(function (r, i) { return (i + 1) + ". " + r.c.n + " : " + r.pct + " %"; });
    return "Mes affinités pour la présidentielle 2027, d'après Isoloir :\n" + lines.join("\n") +
      "\n\nFais le test (rien n'est enregistré)" + (SHARE_URL ? " : " + SHARE_URL : ".");
  }
  function copy(text) {
    const fallback = function () {
      const box = document.createElement("div");
      box.className = "sheet-back"; box.setAttribute("data-a", "closeCopy");
      box.innerHTML = '<div class="sheet copybox" role="dialog" aria-modal="true" aria-label="Texte à copier" data-stop="1"><p class="pair-k">Copie ce texte</p><textarea id="copy-text" readonly rows="7">' + esc(text) + '</textarea><button class="btn primary block" data-a="closeCopy">Fermer</button></div>';
      document.body.appendChild(box);
      const ta = box.querySelector("textarea"); ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(text).then(function () { toast("Copié, prêt à coller"); }, fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- Actions ---------- */
  const ACT = {
    home: function () { V.sheet = null; V.edit = false; V.screen = "home"; render(); },
    start: function () { V.screen = "pacte"; render(); },
    toMode: function () { V.screen = "mode"; render(); },
    pacte: function () { V.screen = "pacte"; render(); },
    pickMode: function (v) {
      S = fresh(); S.mode = v; save();
      if (v === "carte") { S.themes = []; V.screen = "themes"; } else { V.screen = "prio"; }
      render();
    },
    toggleTheme: function (v) { const i = S.themes.indexOf(v); if (i >= 0) S.themes.splice(i, 1); else S.themes.push(v); S.prio = S.prio.filter(function (p) { return S.themes.indexOf(p) >= 0; }); save(); renderKeep(); },
    toThemes: function () { V.screen = "themes"; render(); },
    toPrio: function () { if (!S.themes.length) return; S.themes = THEMES.map(function (t) { return t.id; }).filter(function (id) { return S.themes.indexOf(id) >= 0; }); V.screen = "prio"; render(); },
    toPrioBack: function () { V.screen = "prio"; render(); },
    togglePrio: function (v) { const i = S.prio.indexOf(v); if (i >= 0) S.prio.splice(i, 1); else if (S.prio.length < 3) S.prio.push(v); save(); renderKeep(); },
    beginQuiz: function (v) { if (v === "skip") S.prio = []; buildOrder(); save(); V.chapterSeen = -1; goQuestion(0); },
    resume: function () {
      if (!S.order.length) { ACT.start(); return; }
      let i = S.order.findIndex(function (id) { return !S.ans[id]; });
      if (i < 0) i = S.order.length - 1;
      V.chapterSeen = i; goQuestion(i);
    },
    enterChapter: function () { V.chapterSeen = S.idx; V.screen = "question"; initDraft(); render(); },
    prevQ: function () {
      if (V.screen === "question" && needsChapter(S.idx) && V.chapterSeen === S.idx) { V.chapterSeen = -1; V.screen = "chapter"; render(); return; }
      if (S.idx === 0) { V.screen = "prio"; render(); return; }
      V.chapterSeen = S.idx - 1; goQuestion(S.idx - 1);
    },
    pick: function (v) {
      const q = curQ(); V.draft.v = Number(v);
      renderKeep();
      if (q.f === "j") { const el = document.getElementById("jauge-" + q.id); if (el) el.focus({ preventScroll: true }); }
    },
    imp: function (v) { V.draft.imp = Number(v); renderKeep(); },
    next: function () { if (V.draft.v == null) return; commit(V.draft.v); },
    skipQ: function () { commit(null); },
    results: function () { V.sheet = null; V.screen = "results"; render(); },
    view: function (v) { V.view = v; renderKeep(); },
    sheet: function (v) { V.sheet = v; V.sheetFilter = "all"; renderKeep(); const h = document.getElementById("sheet-h"); if (h) h.focus(); },
    closeSheet: function () { V.sheet = null; renderKeep(); },
    sheetFilter: function (v) { V.sheetFilter = v; renderKeep(); },
    candProg: function (v) { V.sheet = null; V.progTab = "cand"; V.progCand = v; V.screen = "programmes"; render(); },
    review: function () { V.sheet = null; V.screen = "review"; render(); },
    toReview: function () { V.edit = false; V.screen = "review"; render(); },
    editQ: function (v) { const i = S.order.indexOf(v); if (i < 0) return; V.edit = true; S.idx = i; V.screen = "question"; initDraft(); render(); },
    restart: function () {
      S = fresh(); save(); V.sheet = null; V.screen = "pacte"; render();
    },
    programmes: function () { V.sheet = null; V.screen = "programmes"; render(); },
    progTab: function (v) { V.progTab = v; renderKeep(); },
    progTheme: function (v) { V.progTheme = v; renderKeep(); },
    progCand: function (v) { V.progCand = v; renderKeep(); },
    methode: function () { V.sheet = null; V.screen = "methode"; render(); },
    share: function () { copy(shareText()); },
    closeCopy: function () { const b = document.querySelector("body > .sheet-back"); if (b) b.remove(); }
  };

  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    if (el.classList.contains("sheet-back") && e.target.closest("[data-stop]")) return;
    const fn = ACT[el.getAttribute("data-a")];
    if (fn && !el.disabled) { e.preventDefault(); fn(el.getAttribute("data-v")); }
  });
  document.addEventListener("input", function (e) {
    const t = e.target.getAttribute && e.target.getAttribute("data-in");
    if (t === "jauge") { V.draft.v = Number(e.target.value); patchJauge(e.target); }
  });
  function patchJauge(input) {
    const q = curQ(); const v = V.draft.v; const short = q.ol || q.o;
    const rv = app.querySelector(".readout-v"); if (rv) rv.textContent = short[v];
    const rs = app.querySelector(".readout-s"); if (rs) rs.textContent = q.o[v] === short[v] ? "" : q.o[v];
    app.querySelectorAll(".cran").forEach(function (b, i) { b.setAttribute("aria-pressed", String(i === v)); });
    input.classList.add("on"); input.setAttribute("aria-valuetext", q.o[v]);
    if (q.gauge === "nuke") {
      const p = q.pct[v]; const bar = app.querySelector(".nuke-bar i");
      if (bar) { bar.style.width = p + "%"; bar.firstChild.textContent = p >= 25 ? "Nucléaire" : ""; }
      const rest = app.querySelector(".nuke-rest"); if (rest) rest.textContent = p <= 75 ? "Autres sources" : "";
    }
    const nb = app.querySelector('[data-a="next"]'); if (nb) nb.disabled = false;
  }
  document.addEventListener("change", function (e) {
    const t = e.target.getAttribute && e.target.getAttribute("data-in");
    if (t === "faceA") { V.faceA = e.target.value; renderKeep(); }
    if (t === "faceB") { V.faceB = e.target.value; renderKeep(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (document.querySelector("body > .sheet-back")) { ACT.closeCopy(); return; } if (V.sheet) { ACT.closeSheet(); return; } }
    if (V.screen !== "question" || V.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "select" || tag === "textarea") return;
    const q = curQ();
    if (/^[1-9]$/.test(e.key)) {
      const v = Number(e.key) - 1;
      const max = q.f === "n" || q.f === "a" ? 5 : q.o.length + (q.cat ? 1 : 0);
      if (v < max) { e.preventDefault(); ACT.pick(v); }
    } else if (e.key === "Enter" && tag !== "button") {
      if (V.draft.v != null) { e.preventDefault(); ACT.next(); }
    }
  });

  /* ---------- Démarrage ---------- */
  const hash = (location.hash || "").replace("#", "");
  if (hash === "programmes" || hash === "methode") V.screen = hash;
  render();
})();

</script>

</body>
</html>
